[package]
name = "ai-grading-system"
version = "0.1.0"
description = "通用 AI 自动化阅卷系统"
authors = ["Tao"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ai_grading_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset 是 asset:// 协议（convertFileSrc）的开关，缺失会导致前端图片 403
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 用 rustls 而非 native-tls：Windows 上不依赖系统 OpenSSL，打包更省事
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
anyhow = "1"
thiserror = "2"
# 名单文件可能是 Excel 另存的 CSV（中文是 GB18030），UTF-8 解不了要能退回
encoding_rs = "0.8"
hayro = "0.8"
# 上传前的统一瘦身（解码 → 灰度 → 缩放 → JPEG），以及 PDF 页缓存编码
image = { version = "0.25.6", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "bmp",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
